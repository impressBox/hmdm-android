name: Build APK

# Builds the impressbox launcher APK (assembleImpressboxRelease).
#
# Where: GitHub-hosted ubuntu-latest for now (free for this public repository). Our own runner pool
# on the build server (ci/runner/, docs/ci-runners.md) takes over when the repository variables
# HMDM_BUILD_RUNNER=hmdm-build and HMDM_CI_RUNNER=hmdm-ci are set, with no change to this file.
#
#   push to any branch, workflow_dispatch  signed APK, kept as a workflow artifact for 30 days
#                                          (unsigned, named ...-UNSIGNED, while the secrets are not set)
#   tag v*                                 the same, also attached to a GitHub Release for the tag
#   pull request from a fork               unsigned build without secrets (a compile check)
#
# Pull requests from branches of this repository are not built twice: their pushes already are.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  # A newer push to the same branch makes the older build pointless; tags always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  signed:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.HMDM_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: write   # only used on a tag, to attach the APK to its release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner wiring
        shell: bash
        run: bash ci/runner/check-wiring.sh

      # JDK 17 and Gradle's cache. On our pool the image already has JDK 17; this pins the same one.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # apksigner and aapt2 are not on PATH on GitHub-hosted images; use the newest build-tools.
      - name: Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          bt=$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          echo "build-tools: $bt"
          echo "$bt" >> "$GITHUB_PATH"

      # The signing key and the build secrets come from repository secrets (docs/ci-runners.md,
      # "Signing"). With all of them the APK is signed with the impressbox release key; without them
      # it is built unsigned, so the code is still compiled and checked, but the APK is named
      # ...-UNSIGNED and cannot be installed on a panel.
      - name: Signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IMPRESSBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.IMPRESSBOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IMPRESSBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IMPRESSBOX_KEY_PASSWORD }}
          REQUEST_SIGNATURE: ${{ secrets.IMPRESSBOX_REQUEST_SIGNATURE }}
          LIBRARY_API_KEY: ${{ secrets.IMPRESSBOX_LIBRARY_API_KEY }}
          VPN_SECRET: ${{ secrets.IMPRESSBOX_VPN_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD REQUEST_SIGNATURE LIBRARY_API_KEY; do
            [ -n "${!name:-}" ] || missing+=("IMPRESSBOX_$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Building UNSIGNED: missing repository secrets ${missing[*]} (docs/ci-runners.md, Signing)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "${VPN_SECRET:-}" ] || echo "::warning::IMPRESSBOX_VPN_SECRET is not set: this APK cannot enroll in the VPN by itself"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/impressbox.keystore"
          keytool -list -keystore "$RUNNER_TEMP/impressbox.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null \
            || { echo "::error::The keystore does not open with IMPRESSBOX_STORE_PASSWORD, or has no alias IMPRESSBOX_KEY_ALIAS"; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build (signed)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          # Gradle reads ORG_GRADLE_PROJECT_<name> as the project property <name> (app/build.gradle),
          # so nothing secret appears on a command line.
          ORG_GRADLE_PROJECT_impressboxStoreFile: ${{ runner.temp }}/impressbox.keystore
          ORG_GRADLE_PROJECT_impressboxStorePassword: ${{ secrets.IMPRESSBOX_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_impressboxKeyAlias: ${{ secrets.IMPRESSBOX_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_impressboxKeyPassword: ${{ secrets.IMPRESSBOX_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_impressboxRequestSignature: ${{ secrets.IMPRESSBOX_REQUEST_SIGNATURE }}
          ORG_GRADLE_PROJECT_impressboxLibraryApiKey: ${{ secrets.IMPRESSBOX_LIBRARY_API_KEY }}
          ORG_GRADLE_PROJECT_impressboxVpnSecret: ${{ secrets.IMPRESSBOX_VPN_SECRET }}
        run: bash ./gradlew --no-daemon --stacktrace assembleImpressboxRelease

      - name: Build (unsigned)
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: bash ./gradlew --no-daemon --stacktrace assembleImpressboxRelease

      # Panels only accept an update signed with the key they were provisioned with: the impressbox
      # release certificate below (CN=com.impressbox, the one on the shipped launchers). The repository
      # variable IMPRESSBOX_CERT_SHA256 overrides it. Any other certificate fails the build.
      - name: Check the signature
        id: apk
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          EXPECTED_CERT: ${{ vars.IMPRESSBOX_CERT_SHA256 || '7b8a67248176a41bb90f2a4afc39a1c6b9b96847fa224bc9d2c06fb01fb13e56' }}
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/impressbox/release
          if [ "$SIGNED" = true ]; then
            apk=$dir/app-impressbox-release.apk
            [ -f "$apk" ] || { echo "::error::No signed APK in $dir"; ls -la "$dir" || true; exit 1; }
            apksigner verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            cert=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -n1)
            want=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$cert" != "$want" ]; then
              echo "::error::Signed with certificate $cert, expected $want. Panels would refuse this APK as an update."
              exit 1
            fi
            suffix=""
          else
            apk=$dir/app-impressbox-release-unsigned.apk
            [ -f "$apk" ] || { echo "::error::No APK in $dir"; ls -la "$dir" || true; exit 1; }
            cert="none (unsigned: the signing secrets are not set)"
            suffix="-UNSIGNED"
          fi
          badging=$(aapt2 dump badging "$apk" | head -n1)
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging")
          ref=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          name="hmdm-${version}-impressbox-${ref}-${GITHUB_SHA::7}${suffix}"
          mkdir -p out
          cp "$apk" "out/$name.apk"
          sha256sum "out/$name.apk" | tee "out/$name.apk.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name.apk"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | $version ($code) |"
            echo "| commit | \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\` |"
            echo "| certificate SHA-256 | \`$cert\` |"
            echo "| APK SHA-256 | \`$(cut -d' ' -f1 "out/$name.apk.sha256")\` |"
            echo "| runner | \`$RUNNER_NAME\` |"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Install over the current launcher: \`adb install -r $name.apk\`"
            else
              echo "**Unsigned**: a panel will not install this. Set the IMPRESSBOX_* secrets (docs/ci-runners.md, Signing)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag' && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ steps.apk.outputs.name }}.apk
            out/${{ steps.apk.outputs.name }}.apk.sha256
          fail_on_unmatched_files: true

      # Belt and braces: the container is thrown away after the job anyway.
      - name: Remove the signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/impressbox.keystore"

  # Pull requests from forks get no secrets: build unsigned, as a compile check (on our pool: on the
  # ci slots, which never hold anything a signed build reads).
  fork-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.HMDM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner wiring
        shell: bash
        run: bash ci/runner/check-wiring.sh

      # JDK 17 and Gradle's cache. On our pool the image already has JDK 17; this pins the same one.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # apksigner and aapt2 are not on PATH on GitHub-hosted images; use the newest build-tools.
      - name: Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          bt=$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          echo "build-tools: $bt"
          echo "$bt" >> "$GITHUB_PATH"

      - name: Build (unsigned)
        shell: bash
        run: bash ./gradlew --no-daemon --stacktrace assembleImpressboxRelease assembleOpensourceDebug
